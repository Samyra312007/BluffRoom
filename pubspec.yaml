name: bluffroom
description: "BluffRoom — multiplayer Bluff/Cheat card game client for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Realtime game protocol (Socket.IO server compatible)
  socket_io_client: ^3.1.2
  # Persistent session token for rejoin across app restarts
  shared_preferences: ^2.5.3
  # Native Android share sheet for room codes
  share_plus: ^12.0.1
  # List/iterable helpers used by the service layer
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
